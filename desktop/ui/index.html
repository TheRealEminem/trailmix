<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailmix</title>
  <style>
    :root { color-scheme: light dark; --fg: #2b2b2b; --muted: #6b6f6d; --bg: #f7f6f2; --accent: #2f6f4e; --bad: #b2412f; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececea; --muted: #a2a6a3; --bg: #1c1d1c; --accent: #7cc39a; --bad: #e07a68; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { text-align: center; max-width: 36em; padding: 0 16px; }
    h1 { font-weight: 600; font-size: 22px; margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); }
    .spinner { width: 28px; height: 28px; margin: 0 auto 20px; border-radius: 50%;
               border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent);
               animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #problem { display: none; color: var(--bad); margin-top: 12px; white-space: pre-wrap; }
    body.failed .spinner { display: none; }
    body.failed #problem { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1>Starting Trailmix…</h1>
    <p id="hint">The engine is loading. The first start takes a little longer.</p>
    <p id="problem"></p>
  </main>
  <script>
    // The shell calls these as the server comes up (see src/window.rs).
    window.trailmixStatus = (text) => { document.getElementById('hint').textContent = text; };
    window.trailmixFailed = (text) => {
      document.body.classList.add('failed');
      document.getElementById('problem').textContent = text;
    };
  </script>
</body>
</html>
