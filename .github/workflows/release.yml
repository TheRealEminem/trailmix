# Builds the Mac app, tries it end to end, and publishes it as a *pre-release* (a beta).
#   git tag v0.1.0 && git push --tags      -> builds, tests, publishes Trailmix-0.1.0-macos-arm64.dmg as a pre-release
#   Actions tab -> "Build Mac app" -> Run   -> builds and tests it, keeps it as a downloadable artifact only
#     ... on main, with "Release it" ticked -> tags main as v<VERSION> and publishes it, as a pushed tag would
#     ... and "To everyone" ticked too      -> also promotes it right away (scripts/promote.sh), skipping the beta days
# No terminal needed: the Run button works from the GitHub website or app. Releasing stays a person's call;
# automation (Claude Code sessions included) shouldn't press it on its own.
#
# Nothing is published unless scripts/smoke-test.sh passes: as a fresh install, and as an update from the
# current release (installed, then updated by its own auto-updater). A pre-release only reaches people with
# "Beta updates" on; once it's been tried, scripts/promote.sh v0.1.0 makes it the release everyone gets.
name: Build Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release it: tag main as v<VERSION> and publish it as a beta (unticked: a test build only)"
        type: boolean
        default: false
      everyone:
        description: "To everyone: promote it right away instead of after 3 days as a beta (needs Release it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15   # Apple silicon, Xcode 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The release this run makes, if any: the pushed tag, or v<VERSION> when run with "Release it". Checked before
      # the build, so a version that's already out (VERSION not bumped) stops here rather than after it.
      - name: Which version this releases
        id: release
        env:
          RELEASE: ${{ inputs.release && '1' || '0' }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"
          elif [[ "$RELEASE" == 1 ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Releases are made from main, not $GITHUB_REF_NAME"; exit 1; }
            tag="v$(cat VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag is already out. Bump VERSION (and add a What's new entry) first."; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "${tag:-A test build: nothing is published}"
      - name: Build Trailmix.app and the disk image
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then export TRAILMIX_VERSION="${TAG#v}"
          else export TRAILMIX_VERSION="$(cat VERSION).$GITHUB_RUN_NUMBER"; fi  # a test build: newer than the release, to update to
          scripts/build-app.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: "Smoke test: a fresh install"
        run: scripts/smoke-test.sh dist/Trailmix.app
      # The current release's disk image comes from the cache when an earlier run already fetched it, so these
      # tests add one download per release to its count on GitHub, not one per run: the counts stay about people.
      - name: Which release is current
        id: stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: previous/Trailmix-macos-arm64.dmg
          key: current-release-dmg-${{ steps.stable.outputs.tag }}
      - name: "Smoke test: updating from the current release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # (releases from before the per-platform names have only Trailmix-arm64.dmg)
        run: |
          mkdir -p previous
          [ -f previous/Trailmix-macos-arm64.dmg ] \
            || gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Trailmix-macos-arm64.dmg' --dir previous \
            || { gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Trailmix-arm64.dmg' --dir previous \
                 && mv previous/Trailmix-arm64.dmg previous/Trailmix-macos-arm64.dmg; } || true
          if [ -f previous/Trailmix-macos-arm64.dmg ]; then
            scripts/smoke-test.sh dist/Trailmix.app dist/Trailmix-*-macos-arm64.dmg previous/Trailmix-macos-arm64.dmg
          else
            echo "No earlier release to update from"
          fi
      - name: Publish the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        # Each disk image is named for the computer it's for, Trailmix-<version>-macos-<arch>.dmg (the app's updater picks
        # its own by that name), and has a copy with a fixed name, Trailmix-macos-<arch>.dmg, so a link to
        # releases/latest/download/... always works ("latest" skips pre-releases: the last promoted version).
        # Also under the names from before there were other platforms (Trailmix-<version>-arm64.dmg, Trailmix-arm64.dmg):
        # apps from then look for those, and links to them are out there.
        # --target makes the tag on this commit when the run was started with "Release it" (a tag made with this
        # workflow's token doesn't start another run, so it isn't built twice).
        run: |
          cd dist
          V="${TAG#v}"
          for dmg in Trailmix-"$V"-macos-*.dmg; do
            cp "$dmg" "Trailmix-${dmg#Trailmix-"$V"-}"
          done
          cp "Trailmix-$V-macos-arm64.dmg" "Trailmix-$V-arm64.dmg"
          shasum -a 256 "Trailmix-$V-arm64.dmg" >"Trailmix-$V-arm64.dmg.sha256"
          cp Trailmix-macos-arm64.dmg Trailmix-arm64.dmg
          gh release create "$TAG" Trailmix-"$V"-macos-*.dmg Trailmix-"$V"-macos-*.dmg.sha256 Trailmix-macos-*.dmg \
            "Trailmix-$V-arm64.dmg" "Trailmix-$V-arm64.dmg.sha256" Trailmix-arm64.dmg \
            --target "$GITHUB_SHA" --title "Trailmix ${TAG#v}" --generate-notes --prerelease
      - name: Give it to everyone
        if: steps.release.outputs.tag != '' && inputs.everyone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAILMIX_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: scripts/promote.sh "$TAG"
