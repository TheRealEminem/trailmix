# Builds the Mac app for Apple silicon and for Intel Macs, the Windows installers for x64 and ARM PCs and the Linux app
# for x86_64 and ARM, tries each end to end on its own kind of computer, and publishes them as a *pre-release* (a beta).
#   git tag v0.1.0 && git push --tags      -> builds, tests, publishes Trailmix-0.1.0-macos-{arm64,x86_64}.dmg (and,
#                                             with PUBLISH_WINDOWS on, Trailmix-0.1.0-windows-x64.exe; -arm64.exe too with PUBLISH_WINDOWS_ARM64;
#                                             with PUBLISH_LINUX on, Trailmix-0.1.0-linux-{x86_64,arm64}.AppImage, .deb, .rpm) as a pre-release
#   Actions tab -> "Build the apps" -> Run  -> a test build: builds and tests it, keeps it as a downloadable artifact only
#     ... "Platforms": all, or only mac, windows or linux, for a change that can only affect that one
#     ... "Extra checks" ticked             -> also the release-only checks: other Linux distros, updating from the release
#     ... on main, with "Release it" ticked -> tags main as v<VERSION> and publishes it, as a pushed tag would
#     ... and "To everyone" ticked too      -> also promotes it right away (scripts/promote.sh), skipping the beta days
# No terminal needed: the Run button works from the GitHub website or app. Releasing stays a person's call;
# automation (Claude Code sessions included) shouldn't press it on its own.
#
# A release always builds every platform and runs every check: "Platforms" can't trim it. Nothing is published
# unless scripts/smoke-test.sh passes: as a fresh install, and as an update from the current release (installed, then
# updated by its own auto-updater). A pre-release only reaches people with "Beta updates" on; once it's been tried,
# scripts/promote.sh v0.1.0 makes it the release everyone gets.
# The Apple silicon build has to pass for anything to be published. The Intel and Windows ones are published only if
# they pass: without one, those computers simply stay on the last version that had it (the Mac updater skips releases
# without a build for it).
#
# The shared parts (which platforms a run builds, toolchain caches, the current release's files, the Linux distro
# checks) come from TheRealEminem/app-ci at @v1: change them there, and move this file to a new tag on purpose.
name: Build the apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms: which to build on a test build (a release always builds all)"
        type: choice
        options: [all, mac, windows, linux]
        default: all
      extra_checks:
        description: "Extra checks: other Linux distros and updating from the current release, on a test build"
        type: boolean
        default: false
      release:
        description: "Release it: tag main as v<VERSION> and publish it as a beta (unticked: a test build only)"
        type: boolean
        default: false
      everyone:
        description: "To everyone: promote it right away instead of after 3 days as a beta (needs Release it)"
        type: boolean
        default: false
      gpu_whisper:
        description: "GPU whisper.cpp: build Windows x64 and Linux with whisper.cpp on the GPU (Vulkan), CPU without one"
        type: boolean
        default: false

# A newer test build on the same branch replaces one still running. A release (a tag, or "Release it") is never
# cancelled, and never cancels a test build: it's in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release && 'release' || 'build' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}

# Read-only by default; only the publish job can write (make the release).
permissions:
  contents: read

env:
  # GPU_WHISPER: whisper.cpp on the GPU through Vulkan (NVIDIA, AMD and Intel graphics), on the CPU where there's none,
  # in the Windows x64 installer and the Linux app (scripts/build-windows.py, scripts/build-linux.py; Windows ARM and
  # the Macs are unchanged). Off for releases until it's been tried on real GPUs: then whisper.cpp is pywhispercpp's
  # CPU-only wheel, as before. The "GPU whisper.cpp" box on a manual run turns it on for that run. To build every
  # release with it, change the last '0' here to '1'.
  TRAILMIX_GPU_WHISPER: ${{ inputs.gpu_whisper && '1' || '0' }}

jobs:
  # The release this run makes, if any (the pushed tag, or v<VERSION> with "Release it", checked before the builds so
  # a version that's already out stops here), which platforms it builds, and whether the extra checks run.
  plan:
    uses: TheRealEminem/app-ci/.github/workflows/plan.yml@v1
    with:
      platforms: ${{ inputs.platforms }}
      extra_checks: ${{ inputs.extra_checks || false }}
      release: ${{ inputs.release || false }}

  mac:
    needs: plan
    if: needs.plan.outputs.mac != '[]'
    strategy:
      fail-fast: false   # an Intel failure mustn't stop the Apple silicon build, or the other way round
      matrix:
        # arm64 on macos-15 (Apple silicon, Xcode 16); x86_64 on macos-15-intel (GitHub's last Intel Mac image,
        # until about August 2027). The runners are listed in app-ci's plan.yml.
        include: ${{ fromJSON(needs.plan.outputs.mac) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40   # (about 8 minutes on Apple silicon, 16 on Intel)
    env:
      TRAILMIX_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: TheRealEminem/app-ci/setup@v1
        with:
          node-lockfiles: frontend/package-lock.json
          runtime-cache-path: build/cache
          runtime-cache-files: scripts/build-app.sh
          pip-cache-files: backend/constraints.txt backend/requirements*.txt
          cache-suffix: ${{ matrix.arch }}
      - name: Build Trailmix.app and the disk image
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then export TRAILMIX_VERSION="${TAG#v}"
          else export TRAILMIX_VERSION="$(cat VERSION).$GITHUB_RUN_NUMBER"; fi  # a test build: newer than the release, to update to
          scripts/build-app.sh --dmg
      - name: "Smoke test: a fresh install"
        run: scripts/smoke-test.sh dist/Trailmix.app
      # Updating from the current release: releases, and test builds with "Extra checks".
      # (Releases from before the per-platform names have only Trailmix-arm64.dmg; none before that has an Intel build.)
      - uses: TheRealEminem/app-ci/previous-release@v1
        if: needs.plan.outputs.full == 'true'
        id: previous
        with:
          assets: |
            Trailmix-macos-${{ matrix.arch }}.dmg
            ${{ matrix.arch == 'arm64' && 'Trailmix-arm64.dmg' || '' }}
          save-as: previous/Trailmix-macos-${{ matrix.arch }}.dmg
      - name: "Smoke test: updating from the current release"
        if: needs.plan.outputs.full == 'true'
        env:
          OLD: ${{ steps.previous.outputs.path }}
        run: |
          if [ -n "$OLD" ]; then
            scripts/smoke-test.sh dist/Trailmix.app dist/Trailmix-*-macos-"$TRAILMIX_ARCH".dmg "$OLD"
          else
            echo "No earlier release for this Mac to update from"
          fi
      # Only a build that passed is kept for publishing; one that failed is kept too, under another name, to look at.
      # (A week: a release keeps its own copies on the GitHub release.)
      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-dmg-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.sha256
      # (Named so the publish job's download pattern can't pick it up.)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-Trailmix-dmg-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.sha256

  # The Windows installer (scripts/build-windows.py): the desktop shell in desktop/ around the same server and web app,
  # tried as a fresh install by scripts/smoke-test-windows.py. A failure here never holds up the Mac release.
  windows:
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    strategy:
      fail-fast: false   # an ARM failure mustn't stop the x64 build, or the other way round
      matrix:
        # x64 on windows-latest; arm64 on windows-11-arm, GitHub's free ARM runner (whisper.cpp is compiled there:
        # it has no ARM wheel).
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60   # (about 20 minutes on x64, 27 on ARM)
    env:
      TRAILMIX_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: TheRealEminem/app-ci/setup@v1
        with:
          node-lockfiles: |
            frontend/package-lock.json
            desktop/package-lock.json
          python-version: "3.12"
          rust-workspace: desktop/src-tauri
          rust-key: ${{ matrix.arch }}
          runtime-cache-path: build/cache
          runtime-cache-files: scripts/build-windows.py
          pip-cache-files: backend/constraints.txt backend/requirements*.txt
          cache-suffix: ${{ matrix.arch }}-gpu${{ env.TRAILMIX_GPU_WHISPER }}
      # With GPU_WHISPER, the x64 whisper.cpp has GPU support (Vulkan), compiled with the Vulkan SDK: LunarG's own
      # installer, this version, checked against LunarG's checksum (https://sdk.lunarg.com/sdk/sha/<version>/windows/<file>.txt).
      - name: "GPU whisper.cpp: the Vulkan SDK"
        if: matrix.arch == 'x64' && env.TRAILMIX_GPU_WHISPER == '1'
        shell: pwsh
        env:
          VULKAN_VERSION: "1.4.363.0"
          VULKAN_SHA256: "94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141"
        run: |
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:VULKAN_SHA256) { throw "The Vulkan SDK installer failed its checksum" }
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $done = Start-Process $installer -ArgumentList "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow -PassThru
          if ($done.ExitCode -ne 0 -or -not (Test-Path "$sdk\Bin\glslc.exe")) { throw "The Vulkan SDK didn't install (exit $($done.ExitCode))" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Vulkan SDK $env:VULKAN_VERSION in $sdk; vulkan-1.dll in System32: $(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")"
      - name: Build the installer
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        # A test build gets a pre-release version (semver, which the installer needs), newer than the release.
        run: |
          if ($env:TAG) { $env:TRAILMIX_VERSION = $env:TAG.Substring(1) }
          else { $env:TRAILMIX_VERSION = "$((Get-Content VERSION).Trim())-build.$env:GITHUB_RUN_NUMBER" }
          python scripts/build-windows.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whispercpp-tiny-windows
      - name: "Smoke test: a fresh install"
        shell: pwsh
        run: python scripts/smoke-test-windows.py (Get-Item "dist/Trailmix-*-windows-$env:TRAILMIX_ARCH.exe").FullName
      # Updating from the current release: releases, and test builds with "Extra checks".
      - uses: TheRealEminem/app-ci/previous-release@v1
        if: needs.plan.outputs.full == 'true'
        id: previous
        with:
          assets: Trailmix-windows-${{ matrix.arch }}.exe
          save-as: previous/Trailmix-windows-${{ matrix.arch }}.exe
      - name: "Smoke test: updating from the current release"
        if: needs.plan.outputs.full == 'true'
        shell: bash
        env:
          OLD: ${{ steps.previous.outputs.path }}
        # Until a release has a Windows installer, this same build is made again as version 0.0.1 and updated from,
        # so the updater (Update now, then Go back) is still tried end to end.
        run: |
          if [ -z "$OLD" ]; then
            echo "No release has a Windows installer for $TRAILMIX_ARCH yet: building this one again as 0.0.1 to update from"
            rm -rf desktop/src-tauri/target/*/release/bundle/nsis  # (else the build could pick up the first installer)
            TRAILMIX_VERSION=0.0.1 TRAILMIX_OUT=previous/build python scripts/build-windows.py
            OLD=$(ls previous/build/Trailmix-*-windows-"$TRAILMIX_ARCH".exe)
          fi
          python scripts/smoke-test-windows.py dist/Trailmix-*-windows-"$TRAILMIX_ARCH".exe "$OLD"
      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-windows-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.sha256
            dist/*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-Trailmix-windows-${{ matrix.arch }}
          retention-days: 7
          path: dist/*

  # The Linux app (scripts/build-linux.py): the same desktop shell as Windows', as an AppImage, a .deb and an .rpm,
  # tried headless (Xvfb, and PulseAudio with null devices) by scripts/smoke-test-linux.py: the AppImage on the
  # runner, fresh (and, with the extra checks, updated from the current release and back). The .deb and .rpm are tried
  # on other distros by the distros job below. A failure here never holds up the Mac or Windows release.
  # Built on Ubuntu 22.04, the oldest Linux it's for: the shell is linked against the build machine's glibc, so this
  # is what lets it run on glibc 2.35 and later (Ubuntu 22.04, Debian 12); TRAILMIX_MAX_GLIBC stops a build that
  # needs newer. 22.04 has WebKitGTK 4.1 and libsoup 3, which Tauri 2 needs.
  linux:
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    strategy:
      fail-fast: false   # an ARM failure mustn't stop the x86_64 build, or the other way round
      matrix:
        # x86_64 on ubuntu-22.04; arm64 on ubuntu-22.04-arm, GitHub's free ARM runner.
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50   # (about 15 minutes, 22 with the update test)
    env:
      TRAILMIX_ARCH: ${{ matrix.arch }}
      TRAILMIX_MAX_GLIBC: "2.35"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # What building and the smoke test need. (apt-fuse: FUSE 2 for the AppImage, libfuse2 on Ubuntu 22.04,
      # libfuse2t64 from 24.04. GStreamer's plugins: the AppImage brings its own, copied from here, so a recording
      # plays with the WebKitGTK it ships rather than the computer's GStreamer, which may not match it: issue #14.)
      - uses: TheRealEminem/app-ci/setup@v1
        with:
          node-lockfiles: |
            frontend/package-lock.json
            desktop/package-lock.json
          rust-workspace: desktop/src-tauri
          rust-key: linux-ubuntu2204-${{ matrix.arch }}   # (not the cache of builds on Ubuntu 24.04: other libraries)
          apt-packages: >-
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpulse-dev file xdg-utils xvfb xauth
            pulseaudio pulseaudio-utils dbus-x11 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          apt-fuse: "true"
          runtime-cache-path: build/cache
          runtime-cache-files: scripts/build-linux.py
          pip-cache-files: backend/constraints.txt backend/requirements*.txt
          cache-suffix: ${{ matrix.runner }}-gpu${{ env.TRAILMIX_GPU_WHISPER }}
      # With GPU_WHISPER, whisper.cpp is compiled with Vulkan (scripts/build-linux.py, which makes Vulkan's headers and
      # glslc once, in build/cache: cached above). It links against Vulkan's loader, which also makes the runner a
      # computer with a Vulkan driver but no GPU for the smoke tests (the distros' containers have no Vulkan at all),
      # and Mesa's software GPU is there for trying the Vulkan backend itself (--try-vulkan, after the build).
      - name: "GPU whisper.cpp: Vulkan's loader and Mesa's software GPU"
        if: env.TRAILMIX_GPU_WHISPER == '1'
        run: sudo apt-get install -y --no-install-recommends g++ libvulkan1 mesa-vulkan-drivers
      - name: Build the AppImage, .deb and .rpm
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        # A test build gets a pre-release version (semver, which Tauri needs), newer than the release.
        run: |
          if [[ -n "$TAG" ]]; then export TRAILMIX_VERSION="${TAG#v}"
          else export TRAILMIX_VERSION="$(cat VERSION)-build.$GITHUB_RUN_NUMBER"; fi
          python3 scripts/build-linux.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whispercpp-tiny-linux
      - name: "Smoke test: the AppImage, fresh"
        # (and what scrolling the window takes, as a report: TRAILMIX_SCROLL_REPORT)
        env:
          TRAILMIX_SCROLL_REPORT: "1"
        run: python3 scripts/smoke-test-linux.py dist/Trailmix-*-linux-"$TRAILMIX_ARCH".AppImage
      # The smoke tests run whisper.cpp on the CPU, as there's no GPU here: this runs its Vulkan backend too, on Mesa's
      # software GPU (slow, but the same shaders and code as on a real one), and checks the words it hears.
      - name: "GPU whisper.cpp: transcribes through Vulkan (on Mesa's software GPU)"
        if: env.TRAILMIX_GPU_WHISPER == '1'
        run: python3 scripts/build-linux.py --try-vulkan
      # Updating from the current release: releases, and test builds with "Extra checks".
      - uses: TheRealEminem/app-ci/previous-release@v1
        if: needs.plan.outputs.full == 'true'
        id: previous
        with:
          assets: Trailmix-linux-${{ matrix.arch }}.AppImage
          save-as: previous/Trailmix-linux-${{ matrix.arch }}.AppImage
      - name: "Smoke test: updating from the current release"
        if: needs.plan.outputs.full == 'true'
        env:
          OLD: ${{ steps.previous.outputs.path }}
        # Until a release has a Linux AppImage, this same build is made again as version 0.0.1 and updated from, so
        # the updater (Update now, then Go back) is still tried end to end.
        run: |
          if [ -z "$OLD" ]; then
            echo "No release has a Linux AppImage for $TRAILMIX_ARCH yet: building this one again as 0.0.1 to update from"
            TRAILMIX_VERSION=0.0.1 TRAILMIX_OUT=previous/build TRAILMIX_BUNDLES=appimage python3 scripts/build-linux.py --packages-only
            OLD=$(ls previous/build/Trailmix-*-linux-"$TRAILMIX_ARCH".AppImage)
          fi
          python3 scripts/smoke-test-linux.py dist/Trailmix-*-linux-"$TRAILMIX_ARCH".AppImage "$OLD"
      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-linux-${{ matrix.arch }}
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
            dist/*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-Trailmix-linux-${{ matrix.arch }}
          retention-days: 7
          path: dist/*

  # The .deb on the runner's Ubuntu and on Ubuntu 22.04 and 24.04 and Debian 12 and stable as they come, the .rpm on
  # Fedora, and the AppImage on Ubuntu 24.04 (with what a desktop has that an AppImage doesn't bring), each its own
  # job, all at once (app-ci's linux-distros.yml has the list). A release leaves out a .deb or .rpm that failed any of
  # its distros; the AppImage on 24.04 only warns. Releases, and test builds with "Extra checks".
  distros:
    needs: [plan, linux]
    if: always() && needs.plan.outputs.full == 'true' && needs.plan.outputs.linux != '[]'
    uses: TheRealEminem/app-ci/.github/workflows/linux-distros.yml@v1
    with:
      arches: ${{ needs.plan.outputs.linux_arches }}
      artifact_prefix: Trailmix-linux-
      smoke_command: python3 scripts/smoke-test-linux.py
      cache_path: ~/.cache/huggingface
      cache_key: hf-whispercpp-tiny-linux
      container_env: HF_HOME=$APP_CI_CACHE

  publish:
    needs: [plan, mac, windows, linux, distros]
    # Runs even when a build failed: what's published is whatever passed, as long as Apple silicon did.
    if: always() && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # (to make the release: the only job that can)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Trailmix-*
          path: dist
          merge-multiple: true
      - name: Leave out the Linux packages that failed a distro
        env:
          DROP: ${{ needs.distros.outputs.drop || '[]' }}
          DISTROS: ${{ needs.distros.result }}
        run: |
          [ "$DISTROS" = success ] || echo "::warning::The distro checks didn't all finish ($DISTROS)"
          for item in $(jq -r '.[]' <<<"$DROP"); do
            arch="${item%/*}" ext="${item#*/}"
            echo "::warning::The $arch .$ext didn't pass every distro: left out"
            rm -f dist/*-linux-"$arch"."$ext" dist/*-linux-"$arch"."$ext".sha256
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          # On since the Windows app updates itself (0.19.3). "0" keeps the installer out of releases (it's still built,
          # smoke-tested and kept as this run's Trailmix-windows-x64 artifact).
          PUBLISH_WINDOWS: "1"
          # The ARM installer (built and smoke-tested on GitHub's ARM runner). "0" keeps it out of releases (it's still
          # kept as this run's Trailmix-windows-arm64 artifact). Needs PUBLISH_WINDOWS on too.
          PUBLISH_WINDOWS_ARM64: "1"
          # The Linux app, as a beta like Windows': each arch's AppImage (it updates itself) and whichever of its .deb
          # and .rpm passed their tests. "0" keeps them out of releases (they're still built, smoke-tested and kept as
          # this run's Trailmix-linux-<arch> artifacts).
          PUBLISH_LINUX: "1"
        # Each disk image is named for the computer it's for, Trailmix-<version>-macos-<arch>.dmg (the app's updater picks
        # its own by that name), and has a copy with a fixed name, Trailmix-macos-<arch>.dmg, so a link to
        # releases/latest/download/... always works ("latest" skips pre-releases: the last promoted version).
        # Also under the names from before there were other platforms (Trailmix-<version>-arm64.dmg, Trailmix-arm64.dmg):
        # apps from then look for those, and links to them are out there. Each Windows installer,
        # Trailmix-<version>-windows-<arch>.exe (+ .sha256, + the fixed name Trailmix-windows-<arch>.exe), comes along
        # when its build passed (and its switch is on).
        # --target makes the tag on this commit when the run was started with "Release it" (a tag made with this
        # workflow's token doesn't start another run, so it isn't built twice).
        run: |
          cd dist
          rm -f *-failed* *.png  # (never published)
          V="${TAG#v}"
          [ -f "Trailmix-$V-macos-arm64.dmg" ] || { echo "::error::The Apple silicon build didn't pass, so nothing is published"; exit 1; }
          [ -f "Trailmix-$V-macos-x86_64.dmg" ] || echo "::warning::The Intel build didn't pass: this release has none, and Intel Macs stay on the last one that did"
          for dmg in Trailmix-"$V"-macos-*.dmg; do
            cp "$dmg" "Trailmix-${dmg#Trailmix-"$V"-}"
          done
          cp "Trailmix-$V-macos-arm64.dmg" "Trailmix-$V-arm64.dmg"
          shasum -a 256 "Trailmix-$V-arm64.dmg" >"Trailmix-$V-arm64.dmg.sha256"
          cp Trailmix-macos-arm64.dmg Trailmix-arm64.dmg
          WINDOWS=()
          for arch in x64 arm64; do
            if [ "$PUBLISH_WINDOWS" != 1 ] || { [ "$arch" = arm64 ] && [ "$PUBLISH_WINDOWS_ARM64" != 1 ]; }; then
              echo "Windows $arch installer built and tested, not published (PUBLISH_WINDOWS, PUBLISH_WINDOWS_ARM64)"
            elif [ -f "Trailmix-$V-windows-$arch.exe" ]; then
              cp "Trailmix-$V-windows-$arch.exe" "Trailmix-windows-$arch.exe"
              WINDOWS+=("Trailmix-$V-windows-$arch.exe" "Trailmix-$V-windows-$arch.exe.sha256" "Trailmix-windows-$arch.exe")
            else
              echo "::warning::The Windows $arch build didn't pass: this release has no installer for those PCs"
            fi
          done
          LINUX=()
          for arch in x86_64 arm64; do
            if [ "$PUBLISH_LINUX" != 1 ]; then
              echo "Linux $arch packages built and tested, not published (PUBLISH_LINUX)"
            elif [ -f "Trailmix-$V-linux-$arch.AppImage" ]; then
              for ext in AppImage deb rpm; do
                [ -f "Trailmix-$V-linux-$arch.$ext" ] || { echo "::warning::No Linux $arch .$ext this time (its test didn't pass)"; continue; }
                cp "Trailmix-$V-linux-$arch.$ext" "Trailmix-linux-$arch.$ext"
                LINUX+=("Trailmix-$V-linux-$arch.$ext" "Trailmix-$V-linux-$arch.$ext.sha256" "Trailmix-linux-$arch.$ext")
              done
            else
              echo "::warning::The Linux $arch build didn't pass: this release has nothing for those computers"
            fi
          done
          gh release create "$TAG" Trailmix-"$V"-macos-*.dmg Trailmix-"$V"-macos-*.dmg.sha256 Trailmix-macos-*.dmg \
            "Trailmix-$V-arm64.dmg" "Trailmix-$V-arm64.dmg.sha256" Trailmix-arm64.dmg ${WINDOWS[@]+"${WINDOWS[@]}"} ${LINUX[@]+"${LINUX[@]}"} \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Trailmix ${TAG#v}" --generate-notes --prerelease
      - name: Give it to everyone
        if: inputs.everyone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAILMIX_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/promote.sh "$TAG"
