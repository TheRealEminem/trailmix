# Builds the Mac app and publishes it as a GitHub Release.
#   git tag v0.1.0 && git push --tags      -> builds Trailmix-0.1.0-arm64.dmg and attaches it to a release
#   Actions tab -> "Build Mac app" -> Run   -> builds it and keeps it as a downloadable artifact only
name: Build Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15   # Apple silicon, Xcode 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Trailmix.app and the disk image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export TRAILMIX_VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build-app.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Also a copy with a fixed name, so the download page can always link to releases/latest/download/Trailmix-arm64.dmg
        run: |
          cp dist/Trailmix-*-arm64.dmg dist/Trailmix-arm64.dmg
          gh release create "$GITHUB_REF_NAME" dist/Trailmix-*-arm64.dmg dist/Trailmix-*-arm64.dmg.sha256 dist/Trailmix-arm64.dmg \
            --title "Trailmix ${GITHUB_REF_NAME#v}" --generate-notes
